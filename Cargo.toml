[package]
name = "bobs"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Opt in to the existing Tokio/blocking filesystem path for baseline benchmarking.
tokio-fileio-fallback = []
# OpenTelemetry metrics export via OTLP.
telemetry = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]

[dependencies]
axum = { version = "0.8", features = ["macros", "http2"] }
tokio = { version = "1", features = ["full", "test-util"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
dashmap = "6"
async-stream = "0.3"
crc32c = "0.6"
base64 = "0.22"
serde_yml = "0.0.12"
num_cpus = "1"
siphasher = "1"
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.30", features = ["http-proto", "reqwest-client"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Low-level Linux interface chosen over tokio-uring and compio to avoid a
# separate runtime model and retain linked-SQE control; chosen over rio because
# BOBS needs general filesystem operations including open, rename, and unlink.
io-uring = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3"
tower = "0.5"
