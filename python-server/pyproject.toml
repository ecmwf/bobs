[project]
name = "pest"
version = "0.0.1"
description = "Persistent Streaming"
license = { text = "Apache License Version 2.0" }
requires-python = ">=3.10"
dependencies = [
    "starlette",
    "async-files",
    # "aiofiles", # looked less convenient than async-files. Still we want uring
    "uvicorn",
    "orjson",
    "typing_extensions",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "mypy", "pytest-asyncio"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
