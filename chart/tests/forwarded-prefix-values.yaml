replicaCount: 2

global:
  ingress:
    controller: nginx-community

config:
  host_prefix: downloads
  domain: example.com
  route_name: download

ingress:
  enabled: true
  forwardedPrefix:
    enabled: true
  annotations:
    example.com/preserved: kept
