replicaCount: 2

global:
  ingress:
    controller: nginx-community

config:
  host_prefix: downloads
  domain: example.com
  route_name: download

# Deliberately omit ingress.forwardedPrefix: the chart default must keep
# long-poll redirect Locations routable for every replica.
ingress:
  enabled: true
  annotations:
    example.com/preserved: kept
