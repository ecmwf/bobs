apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ include "bobs.fullname" . }}'
  labels:
    app.kubernetes.io/name: '{{ include "bobs.name" . }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  serviceName: '{{ include "bobs.fullname" . }}-svc'
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.retentionPolicy.whenScaled }}
  selector:
    matchLabels:
      app.kubernetes.io/name: '{{ include "bobs.name" . }}'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: '{{ include "bobs.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      # BOBS runs non-root (image USER 10001); fsGroup makes mounted PVCs
      # group-writable so the process can write its spool data + sidecar metadata.
      securityContext:
        {{- toYaml (.Values.podSecurityContext | default (dict "fsGroup" 10001)) | nindent 8 }}
      {{- if .Values.podAntiAffinityHostname }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: '{{ include "bobs.name" . }}'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- include "bobs.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: bobs
          image: {{ include "bobs.image" . | quote }}
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          env:
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOBS_DEPLOYMENT_ENV
              {{- if .Values.observability.deploymentEnv }}
              value: {{ .Values.observability.deploymentEnv | quote }}
              {{- else }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.observability.deploymentEnvConfigMapName | default (printf "%s-observability-env" .Release.Name) | quote }}
                  key: {{ .Values.observability.deploymentEnvConfigMapKey | default "BOBS_DEPLOYMENT_ENV" | quote }}
                  optional: true
              {{- end }}
            - name: BOBS_INTERNAL_BASE_URL_TEMPLATE
              {{- if .Values.internalBaseUrlTemplate }}
              value: {{ tpl .Values.internalBaseUrlTemplate . | quote }}
              {{- else }}
              value: 'http://{{ include "bobs.fullname" . }}-{ordinal}:{{ .Values.service.port }}/api/v1'
              {{- end }}
          command: ["bobs"]
          args: ["/etc/bobs/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            {{- if .Values.config.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.config.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/bobs
              readOnly: true
            - name: data
              mountPath: '{{ .Values.config.data_dir }}'
      volumes:
        - name: config
          configMap:
            name: '{{ include "bobs.fullname" . }}-config'
      {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir:
            {{- with .Values.persistence.emptyDir.medium }}
            medium: {{ . | quote }}
            {{- end }}
            sizeLimit: {{ required "persistence.emptyDir.sizeLimit must be set" .Values.persistence.emptyDir.sizeLimit | quote }}
      {{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        volumeMode: {{ .Values.persistence.volumeMode | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if and .Values.persistence.storageClass (ne .Values.persistence.storageClass "-") }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- else if eq .Values.persistence.storageClass "-" }}
        storageClassName: ""
        {{- end }}
{{- end }}
