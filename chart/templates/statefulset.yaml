apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ include "bobs.fullname" . }}'
  labels:
    app.kubernetes.io/name: '{{ include "bobs.name" . }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  serviceName: '{{ .Values.headlessService.name }}'
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: '{{ include "bobs.name" . }}'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: '{{ include "bobs.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      {{- include "bobs.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bobs
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          command: ["bobs"]
          args: ["/etc/bobs/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: BOBS_INTERNAL_BASE_URL_TEMPLATE
              value: {{ tpl .Values.internalBaseUrlTemplate . | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/bobs
              readOnly: true
            - name: data
              mountPath: '{{ .Values.config.data_dir }}'
      volumes:
        - name: config
          configMap:
            name: '{{ include "bobs.fullname" . }}-config'
      {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if and .Values.persistence.storageClass (ne .Values.persistence.storageClass "-") }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- else if eq .Values.persistence.storageClass "-" }}
        storageClassName: ""
        {{- end }}
{{- end }}
