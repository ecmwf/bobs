apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ include "bobs.statefulsetName" . }}'
  labels:
    # prettier-ignore
    app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
    # prettier-ignore
    app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
spec:
  serviceName: '{{ include "bobs.governingServiceName" . }}'
  # prettier-ignore
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    # prettier-ignore
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    # prettier-ignore
    whenScaled: {{ .Values.persistence.retentionPolicy.whenScaled }}
  selector:
    matchLabels:
      # prettier-ignore
      app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
      # prettier-ignore
      app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
  template:
    metadata:
      # {{- with .Values.podAnnotations }}
      annotations:
        # {{- toYaml . | nindent 8 }}
      # {{- end }}
      labels:
        # prettier-ignore
        app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
        # prettier-ignore
        app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
    spec:
      # BOBS runs non-root (image USER 10001); fsGroup makes mounted PVCs
      # group-writable so the process can write its spool data + sidecar metadata.
      securityContext:
        # {{- include "bobs.podSecurityContext" . | nindent 8 }}
      # {{- if .Values.podAntiAffinityHostname }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  # prettier-ignore
                  app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
                  # prettier-ignore
                  app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
              topologyKey: kubernetes.io/hostname
      # {{- end }}
      # {{- include "bobs.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: bobs
          # prettier-ignore
          image: {{ include "bobs.image" . | quote }}
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          env:
            - name: RUST_LOG
              # prettier-ignore
              value: {{ .Values.rustLog | quote }}
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOBS_DEPLOYMENT_ENV
              # {{- include "bobs.deploymentEnvEntry" . | nindent 14 }}
            - name: BOBS_INTERNAL_BASE_URL_TEMPLATE
              # {{- include "bobs.internalBaseUrlEntry" . | nindent 14 }}
          command: ["bobs"]
          args: ["/etc/bobs/config.yaml"]
          ports:
            - name: http
              # prettier-ignore
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            # {{- if .Values.config.metrics.enabled }}
            - name: metrics
              # prettier-ignore
              containerPort: {{ .Values.config.metrics.port }}
              protocol: TCP
            # {{- end }}
          resources:
            # {{- toYaml .Values.resources | nindent 12 }}
          # {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # {{- end }}
          # {{- with .Values.containerSecurityContext }}
          securityContext:
            # {{- toYaml . | nindent 12 }}
          # {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/bobs
              readOnly: true
            - name: data
              # prettier-ignore
              mountPath: {{ include "bobs.dataDir" . | quote }}
      volumes:
        - name: config
          configMap:
            name: '{{ include "bobs.nameWithSuffix" (dict "base" (include "bobs.fullname" .) "suffix" "-config") }}'
      # {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir:
            # {{- with .Values.persistence.emptyDir.medium }}
            # prettier-ignore
            medium: {{ . | quote }}
            # {{- end }}
            # prettier-ignore
            sizeLimit: {{ required "persistence.emptyDir.sizeLimit must be set" .Values.persistence.emptyDir.sizeLimit | quote }}
      # {{- end }}
# {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        # {{- with .Values.persistence.annotations }}
        annotations:
          # {{- toYaml . | nindent 10 }}
        # {{- end }}
      spec:
        accessModes:
          # {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        volumeMode: Filesystem
        resources:
          requests:
            # prettier-ignore
            storage: {{ .Values.persistence.size | quote }}
        # {{- include "bobs.storageClassName" . | nindent 8 }}
# {{- end }}
