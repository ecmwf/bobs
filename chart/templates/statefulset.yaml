apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ include "bobs.fullname" . }}'
  labels:
    app.kubernetes.io/name: '{{ include "bobs.name" . }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  serviceName: '{{ include "bobs.fullname" . }}-svc'
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: '{{ include "bobs.name" . }}'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: '{{ include "bobs.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      # BOBS runs non-root (image USER 10001); fsGroup makes mounted PVCs
      # group-writable so the process can write its spool data + sidecar metadata.
      securityContext:
        {{- toYaml (.Values.podSecurityContext | default (dict "fsGroup" 10001)) | nindent 8 }}
      {{- if .Values.podAntiAffinityHostname }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: '{{ include "bobs.name" . }}'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- include "bobs.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: bobs
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          env:
            - name: RUST_LOG
              value: info
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POLYTOPE_ENV
              {{- if .Values.polytope.env }}
              value: {{ .Values.polytope.env | quote }}
              {{- else }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.polytope.envConfigMapName | default (printf "%s-observability-env" .Release.Name) | quote }}
                  key: {{ .Values.polytope.envConfigMapKey | default "POLYTOPE_ENV" | quote }}
              {{- end }}
            - name: BOBS_INTERNAL_BASE_URL_TEMPLATE
              {{- if .Values.internalBaseUrlTemplate }}
              value: {{ tpl .Values.internalBaseUrlTemplate . | quote }}
              {{- else }}
              value: 'http://{{ include "bobs.fullname" . }}-{ordinal}:{{ .Values.service.port }}/api/v1'
              {{- end }}
          command: ["bobs"]
          args: ["/etc/bobs/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            {{- if .Values.config.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.config.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/bobs
              readOnly: true
            - name: data
              mountPath: '{{ .Values.config.data_dir }}'
      volumes:
        - name: config
          configMap:
            name: '{{ include "bobs.fullname" . }}-config'
      {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if and .Values.persistence.storageClass (ne .Values.persistence.storageClass "-") }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- else if eq .Values.persistence.storageClass "-" }}
        storageClassName: ""
        {{- end }}
{{- end }}
