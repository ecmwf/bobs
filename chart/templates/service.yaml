apiVersion: v1
kind: Service
metadata:
  name: '{{ include "bobs.fullname" . }}'
  labels:
    # prettier-ignore
    app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
    # prettier-ignore
    app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
spec:
  type: "{{ .Values.service.type }}"
  ports:
    # prettier-ignore
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # {{- if .Values.config.metrics.enabled }}
    # prettier-ignore
    - port: {{ .Values.config.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    # {{- end }}
  selector:
    # prettier-ignore
    app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
    # prettier-ignore
    app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
