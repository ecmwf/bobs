# {{- if .Values.ingress.enabled -}}
# {{- $fullName := include "bobs.fullname" . -}}
# {{- $routeName := include "bobs.routeName" . -}}
# {{- $routePattern := regexQuoteMeta $routeName -}}
# {{- $port := .Values.service.port -}}
# {{- $host := printf "%s.%s" .Values.config.host_prefix .Values.config.domain -}}
# {{- $userAnnotations := .Values.ingress.annotations | default dict -}}
# {{- $controller := include "bobs.ingressController" . -}}
# {{- if eq $controller "nginx-inc" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $fullName }}"
  labels:
    # prettier-ignore
    app.kubernetes.io/name: {{ include "bobs.name" . | quote }}
    # prettier-ignore
    app.kubernetes.io/instance: {{ .Release.Name | toString | quote }}
  annotations:
    nginx.org/mergeable-ingress-type: minion
    nginx.org/location-snippets: |
      {{- if .Values.ingress.forwardedPrefix.enabled }}
      # Preserve the external route prefix for BOBS long-poll redirects. In-cluster
      # callers can also set X-Forwarded-Prefix directly; the app validates it as
      # a short relative path prefix before using it in Location.
      set $bobs_forwarded_prefix "";
      if ($uri ~ ^(/{{ $routePattern }}-\d+)(?:/|$)) {
        set $bobs_forwarded_prefix $1;
      }
      proxy_set_header X-Forwarded-Prefix $bobs_forwarded_prefix;
      # Defining proxy_set_header in a location overrides inherited headers in
      # nginx, so keep the standard forwarded headers explicit here.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      {{- end }}
      rewrite ^/{{ $routePattern }}-\d+/([0-9a-zA-Z-]+)$ /api/v1/read/$1 break;
      rewrite ^/{{ $routePattern }}-\d+/api/v1/read/([^/]+)$ /api/v1/read/$1 break;
      rewrite ^/{{ $routePattern }}-\d+/api/v1/([0-9a-zA-Z-]+)$ /api/v1/read/$1 break;
    # {{- with $userAnnotations }}
    # {{- toYaml . | nindent 4 }}
    # {{- end }}
spec:
  # {{- if .Values.ingress.className }}
  # prettier-ignore
  ingressClassName: {{ .Values.ingress.className | quote }}
  # {{- end }}
  rules:
    # prettier-ignore
    - host: {{ $host | quote }}
      http:
        paths:
          # {{- range $i, $e := until (int $.Values.replicaCount) }}
          # {{- $podName := include "bobs.podName" (dict "root" $ "ordinal" $i) }}
          # prettier-ignore
          - path: {{ printf "/%s-%d" $routeName $i | quote }}
            pathType: Prefix
            backend:
              service:
                name: "{{ $podName }}"
                port:
                  # prettier-ignore
                  number: {{ $port }}
          # {{- end }}
  # {{- if .Values.ingress.tls }}
  tls:
    # {{- toYaml .Values.ingress.tls | nindent 4 }}
  # {{- end }}
# {{- else if eq $controller "nginx-community" }}
# {{- include "bobs.communityIngresses" . -}}
# {{- end }}
# {{- end }}
