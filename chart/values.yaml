replicaCount: 1

# Default fallback for standalone bobs renders. When deployed as a subchart of
# polytope-chart, the parent's `global.ingress.controller` propagates here.
global:
  ingress:
    controller: nginx-inc

imagePullSecrets: []

image:
  repository: bobs
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Empty by default (matches the deployed/vendored chart, which sets no resource
# requests or limits). bobs/chart historically shipped the following explicit
# defaults; uncomment to restore them (recommended for production with large
# page_size / cache settings, ideally together with podAntiAffinityHostname):
# resources:
#   requests:
#     memory: 16Gi
#     cpu: "4"
#   limits:
#     memory: 16Gi
#     cpu: "8"
resources: {}

# When true, add a required hostname pod-anti-affinity so no two BOBS pods in
# this release schedule on the same node (avoids memory-overcommit OOMs when
# requests==limits are large).
podAntiAffinityHostname: false

podAnnotations:
  opensearch.org/include: "true"
  opensearch.org/service.name: bobs

# Pod-level securityContext. Hardened by default: bobs runs non-root (image
# USER 10001) and fsGroup makes mounted PVCs group-writable so the process can
# write its spool data + sidecar metadata. Set to {} to fall back to fsGroup-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# Container-level securityContext. Hardened by default. bobs writes only to its
# data_dir PVC and reads its config read-only, so a read-only root filesystem is
# safe (the historic bobs/chart shipped exactly this). Set to {} to disable.
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # seccompProfile is intentionally unset by default. Kubernetes RuntimeDefault
  # profiles have historically blocked io_uring_setup/io_uring_enter/
  # io_uring_register, which would break BOBS' default Linux I/O backend.
  # Operators may set a validated profile explicitly, for example:
  # seccompProfile:
  #   type: RuntimeDefault

# HTTP health probes against /api/v1/health. Disabled by default (parity with
# the deployed/vendored chart, which ships no probes). Set enabled: true to add
# the readiness/liveness probes bobs/chart historically shipped.
probes:
  enabled: false

# Internal base URL template bobs uses to build per-ordinal pod URLs. Leave empty
# to use the default derived from the release fullname and service port:
#   http://<fullname>-{ordinal}:<service.port>/api/v1
# Set to override (tpl-rendered; `{ordinal}` is substituted by bobs at runtime),
# e.g. to route via the headless service:
#   internalBaseUrlTemplate: 'http://{{ include "bobs.fullname" . }}-{ordinal}.{{ .Values.headlessService.name }}:{{ .Values.service.port }}/api/v1'
internalBaseUrlTemplate: ""

observability:
  # deployment.environment OTel resource attribute.
  # If set, injects BOBS_DEPLOYMENT_ENV directly; otherwise reads from a
  # ConfigMap in the same namespace.
  deploymentEnv: ""
  deploymentEnvConfigMapName: ""
  deploymentEnvConfigMapKey: BOBS_DEPLOYMENT_ENV

config:
  host: "0.0.0.0"
  port: 3000
  # Helm deployment profile. These intentionally override the Rust binary defaults
  # (data_dir ./data, page_size 16 MiB, global cache 256 MiB) with the PVC path
  # and a lower-latency 4 KiB page / 1 MiB global cache. max_cache_bytes may be
  # smaller than page_size. It also derives the weighted response-lifetime read
  # budget as max(1, floor(max_cache_bytes / page_size)); 0 disables caching but
  # retains one bounded disk-backed response.
  data_dir: "/var/lib/bobs"
  # Valid page sizes are 1..=67108864 bytes (64 MiB) and must not exceed
  # max_spool_bytes. Pages larger than the cache bypass it.
  page_size: 4096
  max_cache_bytes: 1048576
  # Separate first-read and recovery admission limit. The explicit chart default
  # matches max_cache_bytes / page_size; operators may override it within 1..=65536.
  max_live_spools: 256
  # Per-spool write limit; must be >= page_size. 8 GiB leaves headroom on the default 10 GiB PVC.
  max_spool_bytes: 8589934592
  # Bound create admission waits; exhausted capacity returns HTTP 503.
  create_admission_timeout_ms: 5000
  # Exposes an unauthenticated, CPU-intensive profiler on the main listener.
  enable_pprof: false
  # io_uring tuning. When unset, BOBS auto-resolves shards = (num_cpus/4).max(1)
  # and a queue capacity of 1024. Explicit shard counts must be in 1..=256.
  # Queue capacity must be 1..=Tokio's Semaphore::MAX_PERMITS
  # (usize::MAX >> 3; 2305843009213693951 on 64-bit).
  # io_uring_shards: 8
  # io_uring_queue_capacity: 4096
  writer_inactivity_timeout_secs: 300
  read_idle_ttl_secs: 600
  full_read_complete_ttl_secs: 30
  # Deprecated compatibility fields: parsed by BOBS but ignored by cleanup.
  reader_done_ttl_secs: 60
  unread_ttl_secs: 3600
  cleanup_sweep_interval_secs: 30
  long_poll_timeout_ms: 25000
  # Required deployment routing values. host_prefix and domain are supplied by
  # the parent chart or operator; route_name intentionally defaults to download.
  host_prefix: ""
  domain: ""
  route_name: "download"
  # Kubernetes metrics profile: bind on all interfaces and allow only collection.
  # The Rust binary defaults are 127.0.0.1 and an empty list (allow all labels).
  metrics:
    enabled: false
    bind_address: "0.0.0.0"
    # Must differ from config.port when enabled in a telemetry build.
    port: 9464
    allowed_labels:
      - collection
    max_label_value_length: 128
    serviceMonitor:
      enabled: false
      interval: 30s
      labels: {}

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  tls: []
  # Preserve the exact external /{route_name}-N pod prefix in BOBS long-poll
  # redirects. Off by default for deployment parity. NGINX Inc uses a location
  # snippet; community ingress-nginx renders one Ingress per replica with its
  # native x-forwarded-prefix annotation. Existing user annotations are retained.
  forwardedPrefix:
    enabled: false

headlessService:
  enabled: true
  name: bobs-svc
