name: Publish chart

on:
  push:
    branches:
      - main
    paths:
      - chart/**

concurrency:
  group: publish-chart
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Get chart version
        id: version
        run: |
          VERSION=$(awk '/^version:/{print $2; exit}' chart/Chart.yaml | tr -d "'\"")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check if version was already released
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/chart/${VERSION}" | grep -q .; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Chart version ${VERSION} is already tagged — skipping publish"
          else
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            echo "New chart version ${VERSION} — will publish"
          fi

  test:
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.20.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" kubeconform
          mkdir --parents "$HOME/.local/bin"
          install "$RUNNER_TEMP/kubeconform" "$HOME/.local/bin/kubeconform"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint and test standalone chart
        run: ./scripts/test-chart.sh

  publish:
    needs: [detect, test]
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release tag via softprops/action-gh-release
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify version consistency
        run: bash scripts/check-versions.sh

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.20.0

      - name: Package chart
        run: helm package chart/

      - name: Login to registry
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
        run: |
          printf '%s' "${HELM_REGISTRY_PASSWORD}" | \
          helm registry login eccr.ecmwf.int \
            --username "${HELM_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Push chart
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: helm push "bobs-${VERSION}.tgz" oci://eccr.ecmwf.int/bobs

      - name: Create and push release tag
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "chart/${VERSION}"
          git push origin "chart/${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chart/${{ needs.detect.outputs.version }}
          name: "bobs chart v${{ needs.detect.outputs.version }}"
          generate_release_notes: true

      - name: Summary
        run: |
          echo "## Chart published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Chart**: \`oci://eccr.ecmwf.int/bobs:${{ needs.detect.outputs.version }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Release**: chart/${{ needs.detect.outputs.version }}" >> "${GITHUB_STEP_SUMMARY}"
