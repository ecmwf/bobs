name: Helm chart

on:
  push:
    branches:
      - "**"
    paths:
      - chart/**
      - scripts/test-chart.sh
      - .github/workflows/chart.yaml
  pull_request:
    paths:
      - chart/**
      - scripts/test-chart.sh
      - .github/workflows/chart.yaml

permissions:
  contents: read

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.20.0

      - name: Lint and test standalone chart
        run: ./scripts/test-chart.sh
