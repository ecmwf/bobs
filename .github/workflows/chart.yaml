name: Helm chart

on:
  pull_request:
    paths:
      - chart/**
      - scripts/test-chart.sh
      - .github/workflows/chart.yaml
  push:
    branches:
      - main
    paths:
      - chart/**
      - scripts/test-chart.sh
      - scripts/check-versions.sh
      - .github/workflows/chart.yaml

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" kubeconform
          mkdir --parents "$HOME/.local/bin"
          install "$RUNNER_TEMP/kubeconform" "$HOME/.local/bin/kubeconform"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint and test standalone chart
        run: ./scripts/test-chart.sh

# Chart publishing lives in ci.yaml: on push to main, the `gate` job decides
# what to publish (image+chart on a code bump, chart only on a chart-only bump)
# and creates a bare {CHART_VERSION} release tag.  This workflow only
# lints/templates the chart on PRs and main.
