name: Helm chart

on:
  push:
    branches:
      - "**"
    paths:
      - chart/**
      - scripts/test-chart.sh
      - .github/workflows/chart.yaml
  pull_request:
    paths:
      - chart/**
      - scripts/test-chart.sh
      - .github/workflows/chart.yaml

permissions:
  contents: read

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.20.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" kubeconform
          mkdir --parents "$HOME/.local/bin"
          install "$RUNNER_TEMP/kubeconform" "$HOME/.local/bin/kubeconform"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint and test standalone chart
        run: ./scripts/test-chart.sh
