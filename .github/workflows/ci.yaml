name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ci-publish-workflows

permissions:
  contents: read

concurrency:
  # Serialise main so two quick merges can't double-publish the same version;
  # cancel superseded PR runs only.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change detection ─────────────────────────────────────────────────────
  # Determines which areas of the repo were touched so downstream jobs can
  # be skipped when their inputs haven't changed.
  #
  # INVARIANT (why the publish jobs below can safely trust these outputs):
  # a release is driven by the version-tag gate, but the gate's rules force a
  # matching source change, so the path filters always agree with it:
  #   - a code+image release requires a Cargo.toml bump  ⇒ `code`  == true
  #   - any chart release requires a chart/Chart.yaml bump ⇒ `chart` == true
  #   - a code bump without a chart bump is a hard gate error
  # So whenever the gate says publish_image/publish_chart == true, the
  # corresponding build-and-test / lint-chart job is guaranteed to have run.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'skaffold.yaml'
              - '.cargo/**'
              - '.github/workflows/ci.yaml'
            chart:
              - 'chart/**'
              - 'scripts/test-chart.sh'
              - '.github/workflows/ci.yaml'

  # ── Lightweight checks (one job to avoid paying a rounded-up billed minute
  #    per trivial check) ──────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Cheaper compiles: skip incremental (useless on fresh runners) and drop
      # debuginfo from the test profile to cut codegen + link time.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # Two runs cover every cfg branch: telemetry ⇒ io_uring backend +
      # telemetry-on code (the config prod ships); tokio-fileio-fallback ⇒ tokio
      # backend + telemetry-off code. No code is gated on both features at once.
      - name: Run telemetry-feature tests (io_uring backend)
        run: cargo test --locked --features telemetry

      - name: Run tokio-fileio-fallback tests (tokio backend)
        run: cargo test --locked --features tokio-fileio-fallback

  # ── Publish gate ───────────────────────────────────────────────────────────
  # On push to main, decide what (if anything) needs publishing.
  #
  # Releases are recorded by a {CHART_VERSION}.dev0 git tag (the ".dev0"
  # suffix keeps the tag inside the org tag-protection ruleset's *.devN
  # exemption — see the release-tag job).  Four cases:
  #   - both tags exist                       → nothing to do, skip
  #   - cargo tag missing, chart tag present  → code bumped without chart bump → ERROR
  #   - both tags missing                     → code+chart release (versions must match)
  #   - cargo tag present, chart tag missing  → chart-only release
  gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/ci-publish-workflows')
    runs-on: ubuntu-latest
    outputs:
      publish_image: ${{ steps.gate.outputs.publish_image }}
      publish_chart: ${{ steps.gate.outputs.publish_chart }}
      cargo_version: ${{ steps.gate.outputs.cargo_version }}
      chart_version: ${{ steps.gate.outputs.chart_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide what to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CARGO_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          CHART_VERSION=$(awk '/^version:/{print $2; exit}' chart/Chart.yaml | tr -d "'\"")
          echo "cargo_version=${CARGO_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"

          cargo_released=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${CARGO_VERSION}.dev0" --jq 'length')
          chart_released=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${CHART_VERSION}.dev0" --jq 'length')

          if [ "${cargo_released}" -gt 0 ] && [ "${chart_released}" -gt 0 ]; then
            echo "Nothing to publish: cargo ${CARGO_VERSION} and chart ${CHART_VERSION} are both already tagged."
            echo "publish_image=false" >> "${GITHUB_OUTPUT}"
            echo "publish_chart=false" >> "${GITHUB_OUTPUT}"
          elif [ "${cargo_released}" -eq 0 ] && [ "${chart_released}" -gt 0 ]; then
            echo "ERROR: Cargo version ${CARGO_VERSION} was bumped but chart version ${CHART_VERSION} already has a release tag." >&2
            echo "Bump chart/Chart.yaml version alongside the code." >&2
            exit 1
          elif [ "${cargo_released}" -eq 0 ] && [ "${chart_released}" -eq 0 ]; then
            if [ "${CHART_VERSION}" != "${CARGO_VERSION}" ]; then
              echo "ERROR: Both code and chart were bumped, but versions differ: Cargo=${CARGO_VERSION}, chart=${CHART_VERSION}." >&2
              echo "They must match on a full code+chart release." >&2
              exit 1
            fi
            echo "Code+chart release at ${CARGO_VERSION}: publishing image and chart."
            echo "publish_image=true" >> "${GITHUB_OUTPUT}"
            echo "publish_chart=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Chart-only release: publishing chart at ${CHART_VERSION} (image stays at ${CARGO_VERSION})."
            echo "publish_image=false" >> "${GITHUB_OUTPUT}"
            echo "publish_chart=true" >> "${GITHUB_OUTPUT}"
          fi

  # ── Image publish (code+chart releases only) ──────────────────────────────
  publish-image:
    needs: [checks, build-and-test, gate]
    # No always(): if build-and-test is skipped this job skips too. That is
    # safe because publish_image == true implies a Cargo.toml bump, which the
    # `code` path filter always catches, so build-and-test always runs here.
    if: needs.gate.outputs.publish_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Install skaffold
        run: |
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64" \
            --output skaffold
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

      - name: Build and push
        env:
          FIXED_TAG: ${{ needs.gate.outputs.cargo_version }}
        run: skaffold build --push

      - name: Tag with commit SHA and push
        env:
          VERSION: ${{ needs.gate.outputs.cargo_version }}
        run: |
          docker tag "eccr.ecmwf.int/polytope/bobs:${VERSION}" "eccr.ecmwf.int/polytope/bobs:sha-${GITHUB_SHA}"
          docker push "eccr.ecmwf.int/polytope/bobs:sha-${GITHUB_SHA}"

      - name: Summary
        env:
          VERSION: ${{ needs.gate.outputs.cargo_version }}
        run: |
          DIGEST=$(docker inspect "eccr.ecmwf.int/polytope/bobs:${VERSION}" \
            --format '{{index .RepoDigests 0}}' 2>/dev/null | cut -d@ -f2 || echo 'unavailable')
          {
            echo "## Image published"
            echo "- **Tag**: \`eccr.ecmwf.int/polytope/bobs:${VERSION}\`"
            echo "- **SHA tag**: \`eccr.ecmwf.int/polytope/bobs:sha-${GITHUB_SHA}\`"
            echo "- **Digest**: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ── Chart lint ────────────────────────────────────────────────────────────
  lint-chart:
    needs: detect-changes
    if: needs.detect-changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" kubeconform
          mkdir --parents "$HOME/.local/bin"
          install "$RUNNER_TEMP/kubeconform" "$HOME/.local/bin/kubeconform"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint and test chart
        run: ./scripts/test-chart.sh

  # ── Chart publish (code+chart and chart-only releases) ────────────────────
  # lint-chart requires 'success' (not 'skipped'): a chart release always
  # bumps chart/Chart.yaml so the `chart` path filter always runs lint-chart.
  publish-chart:
    needs: [checks, build-and-test, gate, lint-chart, publish-image]
    if: >-
      always() &&
      needs.gate.outputs.publish_chart == 'true' &&
      needs.checks.result == 'success' &&
      needs.lint-chart.result == 'success' &&
      (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped') &&
      (needs.publish-image.result == 'success' || needs.publish-image.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Package chart
        run: helm package chart/

      - name: Login to registry
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
        run: |
          printf '%s' "${HELM_REGISTRY_PASSWORD}" | \
          helm registry login eccr.ecmwf.int \
            --username "${HELM_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Push chart
        env:
          VERSION: ${{ needs.gate.outputs.chart_version }}
        run: helm push "bobs-chart-${VERSION}.tgz" oci://eccr.ecmwf.int/bobs

      - name: Summary
        run: |
          echo "## Chart published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Chart**: \`oci://eccr.ecmwf.int/bobs/bobs-chart:${{ needs.gate.outputs.chart_version }}\`" >> "${GITHUB_STEP_SUMMARY}"

  # ── Release tag ────────────────────────────────────────────────────────────
  # Created after all publish jobs succeed or are intentionally skipped.
  # Uses the chart version with a ".dev0" suffix (X.X.X.dev0) as the shared
  # release tag; on a code+chart release the X.X.X part equals the Cargo
  # version (enforced by the gate).  The suffix is required because the org
  # tag-protection ruleset only exempts *.devN tags from its creation block —
  # a bare X.X.X tag would be rejected for the Actions token.
  release-tag:
    needs: [gate, publish-image, publish-chart]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.publish_image != 'true' || needs.publish-image.result == 'success') &&
      (needs.gate.outputs.publish_chart != 'true' || needs.publish-chart.result == 'success') &&
      (needs.gate.outputs.publish_image == 'true' || needs.gate.outputs.publish_chart == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.gate.outputs.chart_version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${CHART_VERSION}.dev0" \
            -f sha="${GITHUB_SHA}"
          {
            echo "## Release tagged"
            echo "- **Tag**: \`${CHART_VERSION}.dev0\`"
            echo "- **SHA**: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
