name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialise main so two quick merges can't double-publish the same version;
  # cancel superseded PR runs only.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lightweight checks (one job to avoid paying a rounded-up billed minute
  #    per trivial check) ──────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Cheaper compiles: skip incremental (useless on fresh runners) and drop
      # debuginfo from the test profile to cut codegen + link time.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # Two runs cover every cfg branch: telemetry ⇒ io_uring backend +
      # telemetry-on code (the config prod ships); tokio-fileio-fallback ⇒ tokio
      # backend + telemetry-off code. No code is gated on both features at once.
      - name: Run telemetry-feature tests (io_uring backend)
        run: cargo test --locked --features telemetry

      - name: Run tokio-fileio-fallback tests (tokio backend)
        run: cargo test --locked --features tokio-fileio-fallback

  # ── Publish gate ───────────────────────────────────────────────────────────
  # On push to main, decide whether this version still needs publishing. A
  # released version is recorded by an immutable {VERSION}.dev<run> marker tag
  # (the only tag shape the org ruleset lets CI create). If a marker already
  # exists the version was published on an earlier merge, so we skip.
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}.dev" --jq 'length')
          if [ "${existing}" -gt 0 ]; then
            echo "Version ${VERSION} already published (${existing} marker tag(s)); skipping."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Version ${VERSION} not yet published; will publish image + chart."
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

  # ── Image publish (only when the version was bumped) ───────────────────────
  publish-image:
    needs: [checks, build-and-test, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          target: release
          build-args: FEATURES=telemetry
          tags: |
            eccr.ecmwf.int/bobs:${{ needs.gate.outputs.version }}
            eccr.ecmwf.int/bobs:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Tag**: \`eccr.ecmwf.int/bobs:${{ needs.gate.outputs.version }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Immutable tag**: \`eccr.ecmwf.int/bobs:sha-${{ github.sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"

  # ── Chart publish (only when the version was bumped) ───────────────────────
  publish-chart:
    needs: [checks, build-and-test, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Lint and test chart
        run: ./scripts/test-chart.sh

      - name: Package chart
        run: helm package chart/

      - name: Login to registry
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
        run: |
          printf '%s' "${HELM_REGISTRY_PASSWORD}" | \
          helm registry login eccr.ecmwf.int \
            --username "${HELM_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Push chart
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: helm push "bobs-chart-${VERSION}.tgz" oci://eccr.ecmwf.int/bobs

      - name: Summary
        run: |
          echo "## Chart published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Chart**: \`oci://eccr.ecmwf.int/bobs/bobs-chart:${{ needs.gate.outputs.version }}\`" >> "${GITHUB_STEP_SUMMARY}"

  # ── Release marker (records that this version is published) ────────────────
  # Created only after both artifacts push, so a partial failure retries next
  # merge. Uses the {VERSION}.dev<run> shape the tag ruleset permits CI to make.
  release-tag:
    needs: [gate, publish-image, publish-chart]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create immutable release marker tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          TAG="${VERSION}.dev${GITHUB_RUN_NUMBER}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}"
          echo "## Release marker" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Version**: ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Marker tag**: ${TAG}" >> "${GITHUB_STEP_SUMMARY}"
