name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialise main so two quick merges can't double-publish the same version;
  # cancel superseded PR runs only.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change detection ─────────────────────────────────────────────────────
  # Determines which areas of the repo were touched so build-and-test and
  # lint-chart can be skipped when their inputs haven't changed. The publish
  # gate below overrides these filters: when a release is due, the
  # corresponding build/lint job runs regardless of what this push touched,
  # so a release never depends on being in the same push as its version bump.
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # for git fetch (push events)
      pull-requests: read   # for GitHub API file listing (PR events)
    outputs:
      code: ${{ steps.filter.outputs.code }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials must be true (the default) here: dorny/paths-filter
        # fetches origin/main to find the merge-base on push events, and needs
        # the token left in the git config to do so.

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'skaffold.yaml'
              - '.cargo/**'
              - '.github/workflows/ci.yaml'
            chart:
              - 'chart/**'
              - 'scripts/test-chart.sh'
              - '.github/workflows/ci.yaml'

  # ── Lightweight checks (one job to avoid paying a rounded-up billed minute
  #    per trivial check) ──────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  build-and-test:
    needs: [detect-changes, gate]
    # gate is skipped on pull requests (empty outputs), so PRs use the path
    # filter alone; on main a pending image release always runs the tests.
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.code == 'true' || needs.gate.outputs.publish_image == 'true')
    runs-on: ubuntu-latest
    env:
      # Cheaper compiles: skip incremental (useless on fresh runners) and drop
      # debuginfo from the test profile to cut codegen + link time.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # Two runs cover every cfg branch: telemetry ⇒ io_uring backend +
      # telemetry-on code (the config prod ships); tokio-fileio-fallback ⇒ tokio
      # backend + telemetry-off code. No code is gated on both features at once.
      - name: Run telemetry-feature tests (io_uring backend)
        run: cargo test --locked --features telemetry

      - name: Run tokio-fileio-fallback tests (tokio backend)
        run: cargo test --locked --features tokio-fileio-fallback

  # ── Publish gate ───────────────────────────────────────────────────────────
  # On push to main, decide what (if anything) needs publishing. The registry
  # is the source of truth (scripts/gate.sh): is image <cargo_version> there,
  # is chart <chart_version> there? Four cases:
  #   - both published                         → nothing to do, skip
  #   - image missing, chart published         → code bumped without chart bump → ERROR
  #   - both missing                           → code+chart release (versions must match)
  #   - image published, chart missing         → chart-only release (Cargo.toml unchanged)
  # A release that was not fully published is therefore retried on every push
  # until it is, and the git tag created afterwards is only a marker.
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish_image: ${{ steps.gate.outputs.publish_image }}
      publish_chart: ${{ steps.gate.outputs.publish_chart }}
      cargo_version: ${{ steps.gate.outputs.cargo_version }}
      chart_version: ${{ steps.gate.outputs.chart_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # gate.sh compares Cargo.toml with HEAD~1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Decide what to publish
        id: gate
        run: bash scripts/gate.sh

  # ── Image publish (code+chart releases only) ──────────────────────────────
  publish-image:
    needs: [checks, build-and-test, gate]
    if: >-
      !cancelled() &&
      needs.gate.outputs.publish_image == 'true' &&
      needs.checks.result == 'success' &&
      needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Install skaffold
        run: |
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64" \
            --output skaffold
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

      - name: Refuse to overwrite a published image
        env:
          VERSION: ${{ needs.gate.outputs.cargo_version }}
        run: |
          if docker manifest inspect "eccr.ecmwf.int/bobs/bobs:${VERSION}" >/dev/null 2>&1; then
            echo "::error::image eccr.ecmwf.int/bobs/bobs:${VERSION} already exists; bump Cargo.toml instead of overwriting it"
            exit 1
          fi

      - name: Build and push
        env:
          FIXED_TAG: ${{ needs.gate.outputs.cargo_version }}
        run: skaffold build --push

      - name: Summary
        env:
          VERSION: ${{ needs.gate.outputs.cargo_version }}
        run: |
          DIGEST=$(docker inspect "eccr.ecmwf.int/bobs/bobs:${VERSION}" \
            --format '{{index .RepoDigests 0}}' 2>/dev/null | cut -d@ -f2 || echo 'unavailable')
          {
            echo "## Image published"
            echo "- **Tag**: \`eccr.ecmwf.int/bobs/bobs:${VERSION}\`"
            echo "- **Digest**: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ── Chart lint ────────────────────────────────────────────────────────────
  lint-chart:
    needs: [detect-changes, gate]
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.chart == 'true' || needs.gate.outputs.publish_chart == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" kubeconform
          mkdir --parents "$HOME/.local/bin"
          install "$RUNNER_TEMP/kubeconform" "$HOME/.local/bin/kubeconform"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint and test chart
        run: ./scripts/test-chart.sh

  # ── Chart publish (code+chart and chart-only releases) ────────────────────
  # On a code+chart release the image must have been pushed in this run; on a
  # chart-only release publish-image is skipped by design.
  publish-chart:
    needs: [checks, build-and-test, gate, lint-chart, publish-image]
    if: >-
      !cancelled() &&
      needs.gate.outputs.publish_chart == 'true' &&
      needs.checks.result == 'success' &&
      needs.lint-chart.result == 'success' &&
      (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped') &&
      (needs.gate.outputs.publish_image != 'true' || needs.publish-image.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Package chart
        run: helm package chart/

      - name: Login to registry
        env:
          HELM_REGISTRY_USERNAME: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          HELM_REGISTRY_PASSWORD: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
        run: |
          printf '%s' "${HELM_REGISTRY_PASSWORD}" | \
          helm registry login eccr.ecmwf.int \
            --username "${HELM_REGISTRY_USERNAME}" \
            --password-stdin

      - name: Refuse to overwrite a published chart
        env:
          VERSION: ${{ needs.gate.outputs.chart_version }}
        run: |
          if helm show chart oci://eccr.ecmwf.int/bobs/bobs-chart --version "${VERSION}" >/dev/null 2>&1; then
            echo "::error::chart bobs-chart ${VERSION} already exists; bump chart/Chart.yaml version instead of overwriting it"
            exit 1
          fi

      - name: Push chart
        env:
          VERSION: ${{ needs.gate.outputs.chart_version }}
        run: helm push "bobs-chart-${VERSION}.tgz" oci://eccr.ecmwf.int/bobs

      - name: Summary
        run: |
          echo "## Chart published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Chart**: \`oci://eccr.ecmwf.int/bobs/bobs-chart:${{ needs.gate.outputs.chart_version }}\`" >> "${GITHUB_STEP_SUMMARY}"

  # ── Release tag ────────────────────────────────────────────────────────────
  # A marker only: created after the publish jobs succeed, never consulted by
  # the gate. Uses the chart version with a ".dev0" suffix (X.X.X.dev0); on a
  # code+chart release the X.X.X part equals the Cargo version (enforced by
  # the gate). The suffix is required because the org tag-protection ruleset
  # only exempts *.devN tags from its creation block — a bare X.X.X tag would
  # be rejected for the Actions token.
  release-tag:
    needs: [gate, publish-image, publish-chart]
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.publish_image != 'true' || needs.publish-image.result == 'success') &&
      (needs.gate.outputs.publish_chart != 'true' || needs.publish-chart.result == 'success') &&
      (needs.gate.outputs.publish_image == 'true' || needs.gate.outputs.publish_chart == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.gate.outputs.chart_version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${CHART_VERSION}.dev0" \
            -f sha="${GITHUB_SHA}"
          {
            echo "## Release tagged"
            echo "- **Tag**: \`${CHART_VERSION}.dev0\`"
            echo "- **SHA**: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
