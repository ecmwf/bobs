name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Image releases are published by manually pushing a v{VERSION} tag.
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight publish (tag push); do cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lightweight checks (one job to avoid paying a rounded-up billed minute
  #    per trivial check) ──────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check version consistency
        run: bash scripts/check-versions.sh

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit

  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Cheaper compiles: skip incremental (useless on fresh runners) and drop
      # debuginfo from the test profile to cut codegen + link time.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # Two runs cover every cfg branch: telemetry ⇒ io_uring backend +
      # telemetry-on code (the config prod ships); tokio-fileio-fallback ⇒ tokio
      # backend + telemetry-off code. No code is gated on both features at once.
      - name: Run telemetry-feature tests (io_uring backend)
        run: cargo test --locked --features telemetry

      - name: Run tokio-fileio-fallback tests (tokio backend)
        run: cargo test --locked --features tokio-fileio-fallback

  # ── Image publish (v{VERSION} tag only) ────────────────────────────────────
  # A maintainer publishes by pushing a v{VERSION} tag (org tag rules forbid CI
  # from creating tags). Runs after the full test gate above and refuses to
  # publish if the tag disagrees with Cargo.toml.
  publish:
    needs: [checks, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and verify version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify version consistency
        run: bash scripts/check-versions.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          target: release
          build-args: FEATURES=telemetry
          tags: |
            eccr.ecmwf.int/bobs:${{ steps.version.outputs.version }}
            eccr.ecmwf.int/bobs:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image published" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Tag**: \`eccr.ecmwf.int/bobs:${{ steps.version.outputs.version }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Immutable tag**: \`eccr.ecmwf.int/bobs:sha-${{ github.sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
